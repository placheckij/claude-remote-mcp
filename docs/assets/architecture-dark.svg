<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">claude-remote-mcp architecture</title>
  <desc id="desc">Three layers. Interaction: the Claude app (voice, mobile, CarPlay, web, desktop). It reaches the orchestration layer on the gateway host over MCP over HTTPS through a Cloudflare Tunnel with an OAuth access token: mcp-gateway handles OAuth, authentication, tool routing and agent operations, and keeps clients and token hashes in oauth.json. mcp-gateway reaches the execution layer on the agent host over HTTP on the LAN with agent-bridge's bearer token: agent-bridge, a stateless HTTP API that only changes agents under its allowed roots, drives herdr workspaces and panes through the herdr CLI, and herdr runs many Claude Code sessions, one per pane.</desc>
