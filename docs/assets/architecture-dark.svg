    .title { fill: #e2f6ff; font-size: 16px; font-weight: 600; }
    .sub { fill: #86aabb; font-size: 11px; }
    .sessiontitle { fill: #e2f6ff; font-size: 13px; font-weight: 600; }
    .store { fill: rgba(95,212,255,0.035); stroke: #5fd4ff; stroke-width: 1.1; stroke-dasharray: 4 3; opacity: 0.9; }
    .storetitle { fill: #e2f6ff; font-size: 13px; font-weight: 600; }
    .rotitle { fill: #5fd4ff; font-size: 10px; letter-spacing: 2px; }
    .rokey { fill: #86aabb; font-size: 11px; }
    .roval { fill: #b9d9e8; font-size: 11px; }
    .wire { fill: none; stroke: #5fd4ff; stroke-width: 1.4; opacity: 0.6; }
    .dotted { fill: none; stroke: #5fd4ff; stroke-width: 1.2; stroke-dasharray: 2 4; opacity: 0.7; }
    .head { fill: #5fd4ff; }
    .wiretag { fill: #02080e; stroke: rgba(95,212,255,0.28); stroke-width: 1; }
    .wirestub { fill: none; stroke: rgba(95,212,255,0.28); stroke-width: 1; }
    .wiretext { fill: #b9d9e8; font-size: 11px; }
    .wirelabel { fill: #86aabb; font-size: 10px; letter-spacing: 1px; }
    .boundary { fill: none; stroke: #ff5a6a; stroke-width: 1; stroke-dasharray: 4 6; opacity: 0.55; }
    .bdiamond { fill: #ff5a6a; }
    .btext { fill: #ff5a6a; font-size: 10px; letter-spacing: 2px; }
    .spark { fill: none; stroke: #9fe6ff; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 7 300; stroke-dashoffset: 7; }
    .s1 { animation: s1 5.6s ease-in-out infinite; }
    .s2 { animation: s2 5.6s ease-in-out infinite; }
    .s3 { animation: s3 5.6s ease-in-out infinite; }
    .s4 { animation: s4 5.6s ease-in-out infinite; }
    @keyframes s1 { 0% { stroke-dashoffset: 7; } 24%, 100% { stroke-dashoffset: -100; } }
    @keyframes s2 { 0%, 26% { stroke-dashoffset: 7; } 50%, 100% { stroke-dashoffset: -100; } }
    @keyframes s3 { 0%, 52% { stroke-dashoffset: 7; } 66%, 100% { stroke-dashoffset: -100; } }
    @keyframes s4 { 0%, 68% { stroke-dashoffset: 7; } 82%, 100% { stroke-dashoffset: -100; } }
    @media (prefers-reduced-motion: reduce) { .spark { animation: none; opacity: 0; } }
  </style>
