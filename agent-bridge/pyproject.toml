[project]
name = "agent-bridge"
version = "0.1.0"
description = "Stateless HTTP service on the agent host that drives the herdr CLI"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
