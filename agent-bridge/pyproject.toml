[project]
name = "claude-remote-mcp-agent-bridge"
version = "0.3.0"
description = "HTTP service on the agent host that drives the herdr CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jakub Płachecki" }]
keywords = ["claude", "claude-code", "herdr", "mcp", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/placheckij/claude-remote-mcp"
Documentation = "https://github.com/placheckij/claude-remote-mcp/tree/main/agent-bridge#readme"
Issues = "https://github.com/placheckij/claude-remote-mcp/issues"
Releases = "https://github.com/placheckij/claude-remote-mcp/releases"

[project.scripts]
agent-bridge = "agent_bridge.cli:main"

[project.gui-scripts]
agent-bridgew = "agent_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The import name isn't the project's name, so hatchling can't find it by itself.
[tool.hatch.build.targets.wheel]
packages = ["src/agent_bridge"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
