name: Mixed versions

# The gateway must work with bridges at its own API version and one behind. Hosts run
# released versions, so each side of this branch is checked against the other's last
# release: the mix that runs while one host is updated before the other.
on:
  pull_request:
    paths:
      - agent-bridge/src/**
      - mcp-gateway/src/mcp_gateway/bridge.py
      - mcp-gateway/src/mcp_gateway/cli.py
      - mcp-gateway/src/mcp_gateway/config.py
      - mcp-gateway/src/mcp_gateway/enrollment.py
      - mcp-gateway/src/mcp_gateway/hosts.py
      - mcp-gateway/src/mcp_gateway/registry.py
      - mcp-gateway/src/mcp_gateway/server.py
      - mcp-gateway/src/mcp_gateway/tools.py
      - mcp-gateway/src/mcp_gateway/replies.py
      - .github/compat/**
      - .github/workflows/compat.yml

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mixed-versions:
    name: mixed versions (gateway and bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: new
          persist-credentials: false
      - name: Find the last releases
        id: releases
        run: |
          last() {
            git -C new ls-remote --tags --refs origin "refs/tags/$1-v*" \
              | sed 's|.*refs/tags/||' | sort -V | tail -n 1
          }
          gateway="$(last mcp-gateway)"
          bridge="$(last agent-bridge)"
          # Until the first release of one, main stands in for it.
          echo "gateway=${gateway:-main}" >>"$GITHUB_OUTPUT"
          echo "bridge=${bridge:-main}" >>"$GITHUB_OUTPUT"
          echo "Old gateway: ${gateway:-main}, old bridge: ${bridge:-main}"
      # Their own folders and venvs, so the versions never share code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.releases.outputs.gateway }}
          path: old-gateway
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.releases.outputs.bridge }}
          path: old-bridge
          persist-credentials: false
      - name: Install uv
        run: pipx install uv==0.13.9
      - name: Install this branch
        run: uv sync --all-packages --frozen --directory new
      - name: Install the last gateway release
        run: uv sync --all-packages --frozen --directory old-gateway
      - name: Install the last bridge release
        run: uv sync --all-packages --frozen --directory old-bridge
      - name: Check every pairing
        run: python3 new/.github/compat/check.py --new new --old-gateway old-gateway --old-bridge old-bridge
