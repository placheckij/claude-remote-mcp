name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS too: its case-insensitive disk is what the folder-trust tests guard against.
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install uv==0.11.15
      - name: Install dependencies
        run: uv sync --all-packages --frozen
      - name: agent-bridge tests
        run: uv run --frozen --package agent-bridge pytest agent-bridge
      - name: mcp-gateway tests
        run: uv run --frozen --package mcp-gateway pytest mcp-gateway
      # Exact, so packages the steps above installed from member dev groups are gone and the
      # root dev group alone has to cover this run. Keep it last for the same reason.
      - name: root tests (both packages in one run)
        run: uv run --frozen --exact pytest

  # Native Windows, for the agent-bridge only: the gateway runs on Linux.
  windows:
    name: agent-bridge tests (windows-latest, Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install uv==0.11.15
      - name: Install dependencies
        run: uv sync --package agent-bridge --frozen
      - name: agent-bridge tests
        run: uv run --frozen --package agent-bridge pytest agent-bridge
      - name: Windows setup and uninstall scripts
        run: uv run --frozen --package agent-bridge pytest tests/test_setup_windows.py

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the Windows deploy scripts
        shell: pwsh
        run: |
          # Pinned, so a new release's rules can't fail an unrelated change.
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          $results = Invoke-ScriptAnalyzer -Path agent-bridge/deploy/windows -Recurse `
            -Settings agent-bridge/deploy/windows/PSScriptAnalyzerSettings.psd1
          $results | Format-List RuleName, Severity, ScriptName, Line, Message
          if ($results) { exit 1 }

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the setup scripts
        run: shellcheck mcp-gateway/deploy/setup.sh agent-bridge/deploy/setup-macos.sh agent-bridge/deploy/macos/*.sh

  # The Linux bridge deploy (#60). Its tests run in the ubuntu tests job above.
  linux-deploy:
    name: shellcheck (agent-bridge/deploy/linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the Linux setup scripts
        run: shellcheck agent-bridge/deploy/linux/*.sh
