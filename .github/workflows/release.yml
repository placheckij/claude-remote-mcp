name: Release agent-bridge

# A tag agent-bridge-vX.Y.Z publishes that version to PyPI as claude-remote-mcp-agent-bridge,
# through Trusted Publishing (PyPI trusts this file and the pypi environment, so no token is
# stored), and makes a GitHub Release with the same files. Renaming this file or the
# environment breaks publishing until the trusted publisher on pypi.org is changed to match.
on:
  push:
    tags: ["agent-bridge-v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    with:
      component: agent-bridge

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install uv==0.13.9
      - name: Check the tag is the package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --package claude-remote-mcp-agent-bridge --short --frozen)"
          if [ "$TAG" != "agent-bridge-v$version" ]; then
            echo "::error::$TAG isn't the version in agent-bridge/pyproject.toml ($version): tag agent-bridge-v$version"
            exit 1
          fi
      - name: Build
        run: uv build --package claude-remote-mcp-agent-bridge --out-dir dist
      - name: Run the built wheel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printed="$(uvx --isolated --from dist/*.whl agent-bridge --version)"
          [ "$printed" = "agent-bridge ${TAG#agent-bridge-v}" ] || { echo "::error::the wheel printed: $printed"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/claude-remote-mcp-agent-bridge/
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          --title "agent-bridge ${TAG#agent-bridge-v}"

  # Builds the Homebrew formula for the published sdist and installs, tests and audits it.
  # No secrets here: installing runs the build scripts of every Python dependency.
  homebrew-formula:
    needs: publish
    runs-on: macos-latest
    env:
      TAP: placheckij/tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Point the formula at the sdist on PyPI
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#agent-bridge-v}"
          # PyPI's JSON API can lag the upload for a while.
          for attempt in $(seq 30); do
            sdist="$(curl -fsS "https://pypi.org/pypi/claude-remote-mcp-agent-bridge/$version/json" \
              | jq -c '.urls[] | select(.packagetype == "sdist")' || true)"
            [ -n "$sdist" ] && break
            sleep 10
          done
          [ -n "$sdist" ] || { echo "::error::PyPI has no sdist of $version"; exit 1; }
          url="$(jq -r .url <<<"$sdist")"
          sha256="$(jq -r .digests.sha256 <<<"$sdist")"
          # Only the formula's own url and sha256 are indented by two spaces.
          sed -i '' -E -e "s|^  url \".*\"|  url \"$url\"|" -e "s|^  sha256 \".*\"|  sha256 \"$sha256\"|" \
            .github/homebrew/agent-bridge.rb
          grep -qF "$url" .github/homebrew/agent-bridge.rb
      - name: Add the Python dependencies as resources
        run: |
          brew tap-new "$TAP" --no-git
          brew trust --tap "$TAP"
          formula="$(brew --repository "$TAP")/Formula/agent-bridge.rb"
          cp .github/homebrew/agent-bridge.rb "$formula"
          # The release is minutes old; its dependencies still wait out Homebrew's cooldown.
          brew update-python-resources --ignore-main-package-cooldown "$TAP/agent-bridge"
          cp "$formula" agent-bridge.rb
      - name: Audit, install and test
        run: |
          brew audit --strict --formula "$TAP/agent-bridge"
          brew install --build-from-source "$TAP/agent-bridge"
          brew test "$TAP/agent-bridge"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula
          path: agent-bridge.rb
          if-no-files-found: error

  homebrew-tap:
    needs: homebrew-formula
    runs-on: ubuntu-latest
    # HOMEBREW_TAP_DEPLOY_KEY: the private half of a deploy key that can write to
    # placheckij/homebrew-tap only.
    environment: homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: placheckij/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: formula/
      - name: Push the formula
        env:
          TAG: ${{ github.ref_name }}
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../formula/agent-bridge.rb Formula/agent-bridge.rb
          git add Formula/agent-bridge.rb
          if git diff --cached --quiet; then
            echo "The tap already has this formula."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "agent-bridge ${TAG#agent-bridge-v}"
          git push
