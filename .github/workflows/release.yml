name: Release agent-bridge

# A tag agent-bridge-vX.Y.Z publishes that version to PyPI as claude-remote-mcp-agent-bridge,
# through Trusted Publishing (PyPI trusts this file and the pypi environment, so no token is
# stored), and makes a GitHub Release with the same files. Renaming this file or the
# environment breaks publishing until the trusted publisher on pypi.org is changed to match.
on:
  push:
    tags: ["agent-bridge-v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install uv==0.11.15
      - name: Check the tag is the package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --package claude-remote-mcp-agent-bridge --short --frozen)"
          if [ "$TAG" != "agent-bridge-v$version" ]; then
            echo "::error::$TAG isn't the version in agent-bridge/pyproject.toml ($version): tag agent-bridge-v$version"
            exit 1
          fi
      - name: Build
        run: uv build --package claude-remote-mcp-agent-bridge --out-dir dist
      - name: Run the built wheel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printed="$(uvx --isolated --from dist/*.whl agent-bridge --version)"
          [ "$printed" = "agent-bridge ${TAG#agent-bridge-v}" ] || { echo "::error::the wheel printed: $printed"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/claude-remote-mcp-agent-bridge/
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          --title "agent-bridge ${TAG#agent-bridge-v}"
