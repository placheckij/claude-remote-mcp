[project]
name = "claude-remote-mcp"
version = "0.1.0"
description = "Voice-driven remote control of Claude Code sessions via a custom MCP connector"
requires-python = ">=3.11"
license = "MIT"
# Depending on both members makes a plain `uv sync` install them too. Without this it
# would remove agent-bridge and its dependencies from the .venv that launchd runs.
dependencies = ["agent-bridge", "mcp-gateway"]

# A root `uv run pytest` installs only the root's dev group, not the members' ones.
[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# Root runs only: each member keeps its own config for `pytest <member>`. Both members have
# a tests/test_config.py, which clash under the default import mode.
[tool.pytest.ini_options]
testpaths = ["agent-bridge/tests", "mcp-gateway/tests"]
addopts = ["--import-mode=importlib"]

[tool.uv]
package = false

[tool.uv.sources]
agent-bridge = { workspace = true }
mcp-gateway = { workspace = true }

[tool.uv.workspace]
members = ["agent-bridge", "mcp-gateway"]
